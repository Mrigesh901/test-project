name: CI - Build & Scan Images

on:
  push:
    branches:
      - develop
      - release
    paths:
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'contracts/**'
      - 'hardhat/**'
      - 'Dockerfile.*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - develop
      - release

env:
  REGISTRY: ghcr.io
  # REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            image_name: test-project-backend
            context: .
          - dockerfile: Dockerfile.frontend
            image_name: test-project-frontend
            context: .
          - dockerfile: Dockerfile.hardhat
            image_name: test-project-hardhat
            context: hardhat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')

          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAG="dev-${{ github.sha }}"
            VERSION="0.1.0-dev.${{ github.run_number }}"
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            TAG="latest"
            VERSION="${{ github.sha }}"
          else
            TAG="branch-${{ github.ref_name }}"
            VERSION="0.0.1-pr"
          fi

          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ matrix.image_name }}"

          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.tag.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.image_name }}'

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-${{ matrix.image_name }}'

  security-summary:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: always()
    steps:
      - name: Security scan summary
        run: |
          echo "✅ Build and security scan complete"
          echo "🔍 Vulnerability reports available in GitHub Security tab"
