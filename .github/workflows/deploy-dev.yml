name: Dev CI + Deploy (k3s)

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'contracts/**'
      - 'hardhat/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - '.github/workflows/deploy-dev.yml'

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: web3games-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            image_name: test-project-backend
            context: .
          - dockerfile: Dockerfile.frontend
            image_name: test-project-frontend
            context: .
          - dockerfile: Dockerfile.hardhat
            image_name: test-project-hardhat
            context: hardhat

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.owner.outputs.owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG="dev-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.owner.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FIX: Configure npm registry and retry settings in build args
      - name: Build and Push with npm fixes
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:latest-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          # Add network mode and build args for npm registry issues
          network: host
          build-args: |
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            NPM_CONFIG_FETCH_TIMEOUT=600000
            NPM_CONFIG_FETCH_RETRIES=5
          # Retry on failure
        continue-on-error: false

      # FIX: Add retry logic if build fails
      - name: Retry build on failure
        if: failure()
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:latest-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          network: host
          build-args: |
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            NPM_CONFIG_FETCH_TIMEOUT=600000
            NPM_CONFIG_FETCH_RETRIES=5
          no-cache: true  # Disable cache on retry

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify k3s cluster
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if needed
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ needs.build-and-push.outputs.owner }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=dev@example.com \
            -n ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update kustomization with new image tags
        run: |
          cd k8s/base
          
          # Update image tags in kustomization.yaml
          sed -i "s|ghcr.io/OWNER|${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}|g" kustomization.yaml
          
          # Also update in hardhat-deployer-job.yaml
          sed -i "s|ghcr.io/OWNER|${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}|g" hardhat-deployer-job.yaml
          sed -i "s|ghcr.io/OWNER|${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}|g" hardhat.yaml
          sed -i "s|ghcr.io/OWNER|${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}|g" backend.yaml
          sed -i "s|ghcr.io/OWNER|${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}|g" frontend.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/dev

      - name: Update deployment images
        run: |
          TAG=${{ needs.build-and-push.outputs.tag }}
          OWNER=${{ needs.build-and-push.outputs.owner }}

          # Update backend
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${OWNER}/test-project-backend:${TAG} \
            -n ${{ env.K8S_NAMESPACE }}

          # Update frontend
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${OWNER}/test-project-frontend:${TAG} \
            -n ${{ env.K8S_NAMESPACE }}

          # Update hardhat
          kubectl set image deployment/hardhat \
            hardhat=${{ env.REGISTRY }}/${OWNER}/test-project-hardhat:${TAG} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for MongoDB to be ready
        run: |
          kubectl rollout status statefulset/mongodb -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Wait for Hardhat to be ready
        run: |
          kubectl rollout status deployment/hardhat -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Deploy smart contracts
        run: |
          # Delete old completed jobs
          kubectl delete jobs -n ${{ env.K8S_NAMESPACE }} -l app=hardhat-deployer --field-selector status.successful=1 || true
          
          # Create a new contract deployment job
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          JOB_NAME="hardhat-deployer-${TIMESTAMP}"
          
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${{ env.K8S_NAMESPACE }}
            labels:
              app: hardhat-deployer
          spec:
            backoffLimit: 2
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels:
                  app: hardhat-deployer
              spec:
                restartPolicy: Never
                initContainers:
                - name: wait-for-hardhat
                  image: busybox:1.36
                  command:
                  - sh
                  - -c
                  - |
                    echo "Waiting for Hardhat node..."
                    until nc -z hardhat 8545; do sleep 5; done
                    echo "Hardhat ready!"
                    sleep 10
                containers:
                - name: deployer
                  image: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}/test-project-hardhat:${{ needs.build-and-push.outputs.tag }}
                  imagePullPolicy: Always
                  command:
                  - sh
                  - -c
                  - |
                    echo "Deploying contracts..."
                    ./node_modules/.bin/hardhat run scripts/deploy/deploy.js --network localhost
                    echo "Deployment complete!"
                  env:
                  - name: HARDHAT_NETWORK_URL
                    value: "http://hardhat:8545"
                  volumeMounts:
                  - name: artifacts
                    mountPath: /app/artifacts
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                volumes:
                - name: artifacts
                  persistentVolumeClaim:
                    claimName: hardhat-artifacts
                imagePullSecrets:
                - name: ghcr-secret
          EOF
          
          # Wait for job to complete
          kubectl wait --for=condition=complete --timeout=5m job/${JOB_NAME} -n ${{ env.K8S_NAMESPACE }} || {
            echo "Contract deployment failed. Check logs:"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} job/${JOB_NAME}
            exit 1
          }
          
          echo "Contract deployment successful!"

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Recent Jobs ==="
          kubectl get jobs -n ${{ env.K8S_NAMESPACE }} -l app=hardhat-deployer --sort-by=.metadata.creationTimestamp

      - name: Run health checks
        run: |
          # Check backend health
          BACKEND_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=backend -o jsonpath='{.items[0].metadata.name}')
          echo "Checking backend health..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} ${BACKEND_POD} -- wget -qO- http://localhost:4000/ || {
            echo "Backend health check failed"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} ${BACKEND_POD} --tail=50
            exit 1
          }
          echo "✅ Backend is healthy"
          
          # Check frontend health
          FRONTEND_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=frontend -o jsonpath='{.items[0].metadata.name}')
          echo "Checking frontend health..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} ${FRONTEND_POD} -- sh -c "nc -z localhost 3000" || {
            echo "Frontend health check failed"
            kubectl logs -n ${{ env.K8S_NAMESPACE }} ${FRONTEND_POD} --tail=50
            exit 1
          }
          echo "✅ Frontend is healthy"

      - name: Deployment summary
        if: always()
        run: |
          echo "========================================="
          echo "🚀 Deployment Summary"
          echo "========================================="
          echo "Tag: ${{ needs.build-and-push.outputs.tag }}"
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"
          echo ""
          echo "Access the application:"
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          echo "  Frontend: http://${NODE_IP}:30002"
          echo "  Backend:  http://${NODE_IP}:30004"
          echo "  Hardhat:  http://${NODE_IP}:30545"
          echo "========================================="
