name: Dev CI + Deploy (k3s)

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  K8S_NAMESPACE: web3games-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            image_name: test-project-backend
            context: .
          - dockerfile: Dockerfile.frontend
            image_name: test-project-frontend
            context: .
          - dockerfile: Dockerfile.hardhat
            image_name: test-project-hardhat
            context: hardhat

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG="dev-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:latest-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify k3s cluster
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Create namespace if needed
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ env.IMAGE_OWNER }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=dev@example.com \
            -n ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          kustomize build k8s/dev | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -

      - name: Update images
        run: |
          TAG=${{ needs.build-and-push.outputs.tag }}

          kubectl set image deployment/backend \
            backend=ghcr.io/${{ env.IMAGE_OWNER }}/test-project-backend:$TAG \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/frontend \
            frontend=ghcr.io/${{ env.IMAGE_OWNER }}/test-project-frontend:$TAG \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/hardhat \
            hardhat=ghcr.io/${{ env.IMAGE_OWNER }}/test-project-hardhat:$TAG \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Verify
        run: |
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}