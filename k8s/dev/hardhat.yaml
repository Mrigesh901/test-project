apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardhat
  labels:
    app: hardhat
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hardhat
  template:
    metadata:
      labels:
        app: hardhat
        environment: dev
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: hardhat
          image: ghcr.io/Mrigesh901/test-project-hardhat:latest-dev
          imagePullPolicy: Always
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          command:
            - sh
            - -c
            - ./node_modules/.bin/hardhat node --hostname 0.0.0.0
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "wget -q --spider http://localhost:8545 || exit 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "wget -q --spider http://localhost:8545 || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hardhat
  labels:
    app: hardhat
spec:
  type: ClusterIP
  selector:
    app: hardhat
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP
