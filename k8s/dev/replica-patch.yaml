# Replica patches for development environment
# Lower replica counts to save resources in dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web3games-dev
spec:
  replicas: 1  # Single replica for dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: web3games-dev
spec:
  replicas: 1  # Single replica for dev
