# Resource limit patches for development environment
# Lower limits to fit on smaller dev clusters
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web3games-dev
spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: web3games-dev
spec:
  template:
    spec:
      containers:
      - name: frontend
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

---
