---
apiVersion: v1
kind: Service
metadata:
  name: hardhat
  namespace: web3games-dev
  labels:
    app: hardhat
spec:
  type: ClusterIP
  ports:
    - port: 8545
      targetPort: 8545
      protocol: TCP
      name: rpc
  selector:
    app: hardhat

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hardhat-artifacts
  namespace: web3games-dev
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods need to read artifacts
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardhat
  namespace: web3games-dev
  labels:
    app: hardhat
spec:
  replicas: 1
  strategy:
    type: Recreate  # Cannot have multiple Hardhat nodes on same network
  selector:
    matchLabels:
      app: hardhat
  template:
    metadata:
      labels:
        app: hardhat
    spec:
      containers:
      - name: hardhat
        image: ghcr.io/Mrigesh901/test-project-hardhat:latest-dev  # Will be updated by CI/CD
        imagePullPolicy: Always
        ports:
        - containerPort: 8545
          name: rpc
        volumeMounts:
        - name: artifacts
          mountPath: /app/artifacts
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8545
            httpHeaders:
            - name: Content-Type
              value: application/json
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                http://localhost:8545
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: hardhat-artifacts
      imagePullSecrets:
      - name: ghcr-secret
