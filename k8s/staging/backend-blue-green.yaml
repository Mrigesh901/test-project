apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-blue
  labels:
    app: backend
    slot: blue
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
      slot: blue
  template:
    metadata:
      labels:
        app: backend
        slot: blue
        environment: staging
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/Mrigesh901/test-project-backend:latest-staging
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "4000"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: staging-config
                  key: mongodb_uri
            - name: HARDHAT_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: staging-config
                  key: hardhat_rpc_url
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
