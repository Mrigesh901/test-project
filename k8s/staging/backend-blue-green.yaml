---
apiVersion: v1
kind: Service
metadata:
  name: backend-blue
  labels:
    app: backend
    slot: blue
spec:
  type: ClusterIP
  selector:
    app: backend
    slot: blue
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-green
  labels:
    app: backend
    slot: green
spec:
  type: ClusterIP
  selector:
    app: backend
    slot: green
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: active-backend
  labels:
    app: backend
    type: load-balancer
spec:
  type: LoadBalancer
  selector:
    app: backend
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
