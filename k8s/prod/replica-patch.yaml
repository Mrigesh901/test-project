# Replica patches for production environment
# Higher replica counts for high availability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web3games-prod
spec:
  replicas: 3  # Multiple replicas for HA

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: web3games-prod
spec:
  replicas: 3  # Multiple replicas for HA

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: web3games-prod
spec:
  replicas: 3  # MongoDB replica set for production
